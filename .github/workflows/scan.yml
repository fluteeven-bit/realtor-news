name: scan

on:
  schedule:
    - cron: "17 */2 * * *"   # 每 2 小時（UTC 的 :17 分，避開整點塞車）
  workflow_dispatch:          # 也可以在 Actions 頁面手動按「Run workflow」

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 測試
        run: node test.mjs
      - name: 掃描
        run: node scan.mjs
      - name: 存檔
        run: |
          git config user.name "realtor-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "沒有新資料"; exit 0; fi
          git commit -q -m "scan $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -q
          git push -q
